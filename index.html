<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NovaBet — Original Crypto Casino</title>
  <meta name="description" content="Original crypto casino interface starter.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#">NOVABET</a>
  <div class="top-actions">
    <button class="btn secondary" id="signin">Sign In</button>
    <button class="btn primary" id="register">Register</button>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <span class="eyebrow">ORIGINAL GAMES</span>
      <h1>Play. Bet. Win.</h1>
      <p>Original casino games with a fast, mobile-first experience.</p>
    </div>
    <div class="hero-actions">
      <button class="btn primary" id="heroRegister">Create Account</button>
      <button class="btn ghost" id="browse">Browse Games</button>
    </div>
  </section>

  <section class="toolbar">
    <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="table">Table</button>
      <button class="tab" data-filter="instant">Instant</button>
      <button class="tab" data-filter="skill">Skill</button>
    </div>
    <input id="search" class="search" placeholder="Search games..." autocomplete="off">
  </section>

  <section id="games" class="games"></section>
</main>

<nav class="bottom-nav">
  <a class="active" href="#">⌂<span>Home</span></a>
  <a href="#games">◈<span>Casino</span></a>
  <a href="#wallet">◉<span>Wallet</span></a>
  <a href="#profile">●<span>Profile</span></a>
</nav>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="close" id="close">×</button>
    <h2 id="modalTitle">Welcome</h2>
    <p id="modalText">Account actions will be connected to the production backend in the next phase.</p>
    <button class="btn primary wide" id="modalAction">Continue</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
